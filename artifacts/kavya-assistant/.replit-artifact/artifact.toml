kind = "mobile"
previewPath = "/"
title = "Kavya 2.0"
description = "A Hindi-English voice assistant for Android that guides users through permissions, understands spoken commands, and helps launch calls, messages, navigation, reminders, media, and device actions with confirmation-first safety."
version = "1.0.0"
id = "artifacts/kavya-assistant"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24509

[services.development]
run = "pnpm --filter @workspace/kavya-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kavya-assistant", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kavya-assistant", "run", "serve" ]

[services.env]
PORT = "24509"
BASE_PATH = "/"
