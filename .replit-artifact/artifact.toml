kind = "mobile"
previewPath = "/youtube-uploader-mobile/"
title = "YouTube Uploader Companion"
description = "An Android-ready companion app for managing YouTube upload metadata, reviewing upload reports, and monitoring upcoming scheduled Shorts uploads from the uploader repository."
version = "1.0.0"
id = "artifacts/youtube-uploader-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/youtube-uploader-mobile/" ]
localPort = 18346

[services.development]
run = "pnpm --filter @workspace/youtube-uploader-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/youtube-uploader-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/youtube-uploader-mobile", "run", "serve" ]

[services.env]
PORT = "18346"
BASE_PATH = "/youtube-uploader-mobile/"
